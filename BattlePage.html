<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hash Validator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0b1220;
            --card-bg: #0f1724;
            --muted: #9aa4b2;
            --accent: #00d1b2;
            --accent-dark: #00a88f;
            --glass: rgba(255, 255, 255, 0.03);
            --border-light: rgba(255, 255, 255, 0.05);
            --text-primary: #e6eef6;
            --text-secondary: #a3b1cc;
            --text-soft: #6b7b98;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            --link: #28cfa5;
            --hash-value: #35dddd;
            --border-light: rgba(255, 255, 255, 0.05);
            --card: #0f1724;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(180deg, #071122 0%, #0b1220 100%);
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            color: var(--text-primary);
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px;
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 8px;
            background: linear-gradient(90deg, var(--accent), var(--accent-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: var(--muted);
            max-width: 600px;
            margin: 0 auto;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-light);
        }

        .card-header {
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-light);
        }

        .card-header h2 {
            font-size: 18px;
            font-weight: 600;
        }

        .game-info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            align-items: end;
            background-color: #0d1726;
            /*
            padding: 16px;
            */
            border-radius: 12px;
            margin-bottom: 8px;
        }

        .info-item {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .info-item label {
            font-size: 14px;
            color: var(--muted);
            font-weight: 500;
        }

        .info-value {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            padding: 10px 12px;
            border: 1px solid var(--border-light);
            color: var(--text-secondary);
            font-size: 16px;
            transition: all 0.2s;
        }

        .info-value input {
            width: 100%;
            border: none;
            background: transparent;
            outline: none;
            color: var(--text-secondary);
            font-size: 16px;
        }

        .info-value span {
            color: var(--text-secondary);
        }

        .players-results {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-top: 24px;
        }

        .player-card {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            border: 1px solid var(--border-light);
            overflow: hidden;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .player-header {
            padding: 20px 20px 0 20px;
        }

        .player-detail {
            margin-bottom: 16px;
        }

        .player-detail .block-number {
            color: var(--text-soft);
            font-family: monospace;
            font-size: 12px;
            white-space: nowrap;
        }

        .detail-label {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 6px;
            font-size: 16px;
            color: var(--muted);
        }

        .signature-info {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }

        .signature-info a {
            color: var(--link);
            text-decoration: none;
            white-space: nowrap;
            font-size: 18px;
        }

        .detail-value {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 6px;
            padding: 10px 12px;
            border: 1px solid var(--border-light);
            font-family: monospace;
            font-size: 13px;
            word-break: break-all;
            color: var(--text-secondary);
        }

        .detail-value input {
            width: 100%;
            border: none;
            background: transparent;
            outline: none;
            color: inherit;
            font-family: inherit;
            font-size: inherit;
        }

        .rounds-container {
            background: rgba(0, 0, 0, 0.2);
            padding: 20px;
            border-top: 1px solid var(--border-light);
            flex: 1;
        }

        .rounds-header {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: #3b5580;
            margin-bottom: 12px;
            padding: 0 4px;
        }

        .round-item {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            border: 1px solid var(--border-light);
            margin-bottom: 12px;
            overflow: hidden;
        }

        .round-title {
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.2);
            font-size: 14px;
            color: var(--muted);
            border-bottom: 1px solid var(--border-light);
        }

        .round-hash {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            gap: 12px;
            word-break: break-word;
        }

        .round-hash span:first-child {
            font-family: monospace;
            font-size: 12px;
            color: var(--text-secondary);
            flex: 1;
        }

        .round-hash span:last-child {
            color: var(--hash-value);
            font-weight: 600;
            white-space: nowrap;
        }

        .empty-rounds {
            text-align: center;
            color: var(--muted);
            padding: 30px 20px;
            font-size: 14px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        details {
            border: 1px solid #e3ff6a;
            border-radius: 8px;
            padding: 0.5em 0.5em 0;
        }

        summary {
            font-weight: bold;
            margin: -0.5em -0.5em 0;
            padding: 0.5em;
        }

        details[open] {
            padding: 0.5em;
        }

        details[open] summary {
            border-bottom: 1px solid #e3ff6a;
            margin-bottom: 0.5em;
        }

        .toolbar {
            display: flex;
            gap: 12px;
            align-items: center;
            margin: 0 0 8px 0;
        }

        button {
            background: #50fa7b;
            border: none;
            color: #1e1e2f;
            font-weight: bold;
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
        }

        .clear-btn {
            background: #ff5555;
            color: white;
        }

        .rest-btn {
            background: #0e73ef;
            color: white;
        }

        .div-code-textarea {
            display: grid;
            margin: 0 0 8px 0;
        }

        .code-textarea {
            background: #1e1f29;
            color: #f8f8f2;
            border: 1px solid #44475a;
            border-radius: 12px;
            font-family: 'Fira Code', 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.5;
            padding: 16px;
            resize: none;
            outline: none;
            height: 300px;
        }

        .output-area {
            background: #0f0f16;
            border-radius: 12px;
            padding: 12px 16px;
            height: 200px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 13px;
            border: 1px solid #44475a;
            margin: 0 0 8px 0;
        }

        .output-title {
            color: #bd93f9;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 0.9rem;
            display: flex;
            gap: 16px;
            align-items: baseline;
        }

        .output-content {
            color: #e9e9f4;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(255, 255, 255, 90%);
            color: #000000;
            padding: 20px 40px;
            border-radius: 5px;
            display: none;
            z-index: 1000;
        }

        @media (max-width: 640px) {
            .container {
                padding: 16px;
            }

            .game-info-grid {
                grid-template-columns: 1fr;
            }

            .players-results {
                grid-template-columns: 1fr;
            }

            .round-hash {
                flex-direction: column;
                align-items: center;
                gap: 8px;
            }
            .round-hash span:first-child {
                word-break: break-all;
                text-align: center;
                width: 100%;
            }
            .round-hash span:last-child {
                white-space: nowrap;
            }

            .toolbar {
                flex-wrap: wrap;
            }
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }
    </style>
</head>
<body>
<div id="toast" class="toast"></div>
<div class="container">
    <div class="header">
        <h1>Hash Validator</h1>
    </div>

    <div class="card">
        <div class="toolbar">
            <button id="runBtn">&#9654; Run</button>
            <button id="clearOutputBtn" class="clear-btn">🗑 Clear</button>
            <button id="restCodeBtn" class="rest-btn">&#8635; Rest</button>

        <details id="codePanel">

                </textarea>
            </div>
            <div class="output-area">
                <div class="output-title">
                    <span>📋 Logs Print</span>
                </div>
                <div id="outputContent" class="output-content">✨ Click "Run" to view the result.</div>

    <div class="card">
        <div class="game-info-grid">
            <div class="info-item">
                <label>Previous BlockHash（H-1）</label>

            </div>
        </div>
        <div class="game-info-grid">
            <div class="info-item">
                <label>Current BlockHash（H0）</label>
                <div class="info-value">
                    <input id="blockHashInp" value="">
                </div>
            </div>
        </div>
        <div class="game-info-grid">
            <div class="info-item">
                <label>Next BlockHash（H1）</label>
                <div class="info-value">
                    <input id="blockHashLast1Inp" value="">
                </div>
            </div>
        </div>
        <div class="game-info-grid">
            <div class="info-item">
                <label>Next BlockHash（H2）</label>
                <div class="info-value">
                    <input id="blockHashLast2Inp" value="">
                </div>
            </div>
        </div>
        <div class="game-info-grid">
            <div class="info-item">
                <label>Next BlockHash（H3）</label>
                <div class="info-value">
                    <input id="blockHashLast3Inp" value="">
                </div>
            </div>
        </div>
        <div class="game-info-grid">
            <div class="info-item">
                <label>Player Number</label>
                <div class="info-value">
                    <input type="number" id="joinNum" min="2" max="3" value="2">
                </div>
            </div>
            <div class="info-item">
                <label>Round</label>
                <div class="info-value">
                    <input type="number" id="round" min="0" max="100" value="0">
                </div>
            </div>
        </div>

        <div class="card-header">
            <h5>The following values are the results obtained after running the code through the "Online JS Code Editor."</h5>
        </div>

        <div id="playersContainer" class="players-results"></div>
    </div>

</div>

<script type="module">
    let logs = "";
    let userNum = 2;
    let defaultCode = "";
    //Did the code run successfully?
    let isCodePass = false;
    // get DOM element
    const runBtn = document.getElementById('runBtn');
    const clearOutputBtn = document.getElementById('clearOutputBtn');
    const restCodeBtn = document.getElementById('restCodeBtn');
    const showCodeEditorBtn = document.getElementById('showCodeEditorBtn');
    const codeEditor = document.getElementById('codeEditor');
    const outputContentDiv = document.getElementById('outputContent');
    const codePanel = document.getElementById("codePanel");
    const blockHashAfterInp = document.getElementById("blockHashAfterInp");
    const blockHashInp = document.getElementById("blockHashInp");
    const blockHashLast1Inp = document.getElementById("blockHashLast1Inp");
    const blockHashLast2Inp = document.getElementById("blockHashLast2Inp");
    const blockHashLast3Inp = document.getElementById("blockHashLast3Inp");

    // bind event
    runBtn.addEventListener('click', onRunClick);

    showCodeEditorBtn.addEventListener('click', showCodeEditor);
    codePanel.addEventListener('toggle', setBtnText);
    copyCodeBtn.addEventListener("click", onClickCopyCode);
    joinNumInput.addEventListener('blur', function() {
        if (this.validity.rangeUnderflow) {
            this.value = this.min;
        }
        if (this.validity.rangeOverflow) {

        }

    roundInput.addEventListener('blur', function() {

            this.value = this.min;
        }
        if (this.validity.rangeOverflow) {
            this.value = this.max;
        }
    });

    //toast
    function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.innerText = msg.toString();
        toast.style.display = 'block';
        setTimeout(() => {
            toast.style.display = 'none';
        }, 1000);
    }

    async function onClickCopyCode() {
        try {
            let text = codeEditor.value + "\nExecution Results\n" + logs;
            await navigator.clipboard.writeText(text);
            showToast("Copy Success");
        } catch (err) {
            showToast("Copy Failed");
            console.error('Unable to copy text: ', err);
        }
    }

    function getUrlParams() {
        const params = new URLSearchParams(window.location.search);
        const playerCount = parseInt(params.get('playerCount')) || 0;
        const validatedPlayerCount = Math.min(Math.max(playerCount, 2), 3);
        const round = parseInt(params.get('round')) || 0;
        const blockHash_1 = params.get('h-1') || "";
        const blockHash = params.get('h0') || "";
        const blockHash_2 = params.get('h1') || "";
        const blockHash_3 = params.get('h2') || "";
        const blockHash_4 = params.get('h3') || "";

        const result = {
            playerCount: validatedPlayerCount,
            round: round,
            blockHash_1,
            blockHash,
            blockHash_2,
            blockHash_3,
            blockHash_4,
            userWallet: [],
        };

        for (let i = 1; i <= validatedPlayerCount; i++) {
            result[`player${i}Name`] = params.get(`player${i}Name`) || `Player${i}`;
            result[`player${i}Sign`] = params.get(`player${i}Sign`) || '';
            result[`player${i}Hash`] = params.get(`player${i}Hash`) || '';
            result[`player${i}Block`] = params.get(`player${i}Block`) || '';
            result[`player${i}wallet`] = params.get(`u${i}`) || '';
            result.userWallet.push(result[`player${i}wallet`]);
        }
        return result;
    }


    function updateVerifyButton() {
        let allFilled = true;
        for (let i = 0; i < userNum; i++) {
            const signInput = document.getElementById(`userWallet_${i}`);
            const hashInput = document.getElementById(`blockHash_${i}`);
            if (!signInput || !hashInput) {
                allFilled = false;
                break;
            }
            const signVal = signInput.value.trim();
            const hashVal = hashInput.value.trim();
            if (!signVal || !hashVal) {
                allFilled = false;
                break;
            }
        }
    }

    /**
     * Set Block Information and Code
     * Required Parameters
     * blockHash_1 preHash
     * blockHash currHash
     * blockHash_2 next hash1
     * blockHash_3 next hash2
     * blockHash_4 next hash3
     * userWallet user wallet
     * round rounNnum
     * @param params
     */
    function setCodeAndInfo(params) {
        blockHashAfterInp.value = params.blockHash_1;
        blockHashInp.value = params.blockHash;
        blockHashLast1Inp.value = params.blockHash_2;
        blockHashLast2Inp.value = params.blockHash_3;
        blockHashLast3Inp.value = params.blockHash_4;
        defaultCode =
`//Calculate the hash of the current string.
async function computeBaseHash(str) {
    //1.Convert to a UTF-8 encoded byte sequence.
    const encoder = new TextEncoder();
    const bytes = encoder.encode(str);
    //2.Byte Array
    let bytesArr = await computeSha256(bytes);
    //3.Concatenate hexadecimal strings
    let hexString = bytesToHex(bytesArr);
    console.log("Converted hexadecimal string: ",hexString);
    return hexString;
}

//Calculate the SHA-256 value of a byte array.
async function computeSha256(data) {
    const hashBuffer = await crypto.subtle.digest('SHA-256', data);
    return new Uint8Array(hashBuffer);
}

//Convert a byte array to a hexadecimal string.
function bytesToHex(bytes) {
    return Array.from(bytes).map(b => b.toString(16).padStart(2, '0')).join('');
}

//Normalization Function
async function normalizeHash(decoded) {
    try {
        const hashArray = Array.from(decoded);
        let hashValue = 0n;
        for (const byte of hashArray) {
            hashValue = (hashValue << 8n) + BigInt(byte);
        }
        const maxValue = 1n << 256n;          // 2^256
        // Use BigInt to calculate scaled values to avoid precision loss.
        const scaledBigInt = (hashValue * 100000n) / maxValue;
        return Number(scaledBigInt);
    } catch (e) {
        console.error('NormalizeHash Fail: ', e);
        throw new Error("normalizeHash Fail:" + e.message);
    }
}
class UserInfo {
    roundNum = 0;
    hexStr = "";
    boxNum = 0;
}
//Generate your own information based on a string and the round number.
async function creatSelfInfo(str, roundNum) {
    let info = [];
    const encoder = new TextEncoder();
    let previousHex = str;
    for (let i = 0; i < roundNum; i++) {
        let userInfo = new UserInfo();
        // Encode a hexadecimal string into UTF-8 bytes.
        const inputBytes = encoder.encode(previousHex);
        const hashBytes = await computeSha256(inputBytes);
        const hexStr = bytesToHex(hashBytes);
        const normalized = await normalizeHash(hashBytes);
        // console.log("Current ", i);
        // console.log("Hexadecimal string ", hexStr);
        // console.log("Random Value ", normalized);
        userInfo.roundNum = i + 1;
        userInfo.hexStr = hexStr;
        userInfo.boxNum = normalized;
        info.push(userInfo);
        previousHex = hexStr;
    }

    return info;
}

async function main() {
    let result = [];
    for (var i = 0; i < ${params.userWallet.length}; i++) {
        var user = ${JSON.stringify(params.userWallet)}[i];
        let str = "${params.blockHash_1}" + "${params.blockHash}" + "${params.blockHash_2}" + "${params.blockHash_3}" + "${params.blockHash_4}";
        let base = await computeBaseHash(str);
        console.log("Hexadecimal string： ",base);
        //user wallet
        let userPublicKey = ${JSON.stringify(params.userWallet)}[i];;
        let basePublicKey = base + userPublicKey;
        //create self info
        let userInfoList = await creatSelfInfo(basePublicKey, ${params.round});
        console.log("userInfoList  ", userInfoList);
        result.push(userInfoList);
    }
    return result;
}
return await main();
`;
    }

    async function initPage() {
        let isSupport = showCryptoStatus();
        if (!isSupport) {
            alert("The current environment does not support SHA-256 function computation.");
            return;
        }
        const params = getUrlParams();
        setCodeAndInfo(params);
        restCode();

        let userRoundList = await anonymous_fun.run(defaultCode);
        if (!isCodePass) {
            alert("A JavaScript execution error occurred. Please resolve the error or reset the code.");
            return;
        }

        userNum = params.playerCount;
        document.getElementById('round').value = params.round;
        document.getElementById('joinNum').value = userNum;

        const joinNumInput = document.getElementById('joinNum');
        joinNumInput.addEventListener('input', function(event) {
            const newCount = parseInt(event.target.value) || 2; 
            const validatedCount = Math.min(Math.max(newCount, 2), 3); 
            if (validatedCount !== userNum) {

                for (let i = 0; i < userNum; i++) {

                    if (signInput) signInput.addEventListener('input', updateVerifyButton);
                    if (hashInput) hashInput.addEventListener('input', updateVerifyButton);
                }
                updateVerifyButton();
            }
        });

        renderPlayerCards(params, userRoundList);
        let allFilled = true;
        for (let i = 0; i < userNum; i++) {
            const signInput = document.getElementById(`userWallet_${i}`);
            const hashInput = document.getElementById(`blockHash_${i}`);
            if (!signInput || !hashInput || !signInput.value.trim() || !hashInput.value.trim()) {
                allFilled = false;
                break;
            }
        }
        if (allFilled) {
            // verifyGames();
        }

        for (let i = 0; i < userNum; i++) {
            const signInput = document.getElementById(`userWallet_${i}`);
            const hashInput = document.getElementById(`blockHash_${i}`);
            if (signInput) signInput.addEventListener('input', updateVerifyButton);
            if (hashInput) hashInput.addEventListener('input', updateVerifyButton);
        }
        updateVerifyButton();

    }

    function renderPlayerCards(params, roundList) {
        const container = document.getElementById('playersContainer');
        let html = '';
        for (let i = 1; i <= userNum; i++) {
            const playerName = params[`player${i}Name`] || `Player${i}`;
            const sign = params[`player${i}Sign`] || '';
            const hash = params[`player${i}Hash`] || '';
            const block = params[`player${i}Block`] || '';
            const wallet = params[`player${i}wallet`] || '';

            html += `
                <div class="player-card" id="playerCard_${i-1}">
                    <div class="player-header">

                        <div class="player-detail">
                            <div class="detail-label">
                                <span>Wallet Address</span>
                                <div class="signature-info">
                                    <a href="https://solscan.io/account/${wallet}" target="_blank">View on Solana →</a>

                            <div class="detail-value">

                            <span>Interval Value (0-99999)</span>
                        </div>
                        <div id="resultRound_${i-1}" class="empty-rounds">
                            Click the "Run" button to start verification.
                        </div>
                    </div>
                </div>
            `;
        }
        container.innerHTML = html;
        for (let i = 0; i < userNum; i++) {
            setUserRoundInfo(i,roundList[i]);
        }

    }

    function initEmptyResults() {
        for (let i = 0; i < userNum; i++) {
            const el = document.getElementById(`resultRound_${i}`);
            if (el) {
                el.innerHTML = `<div class="empty-rounds">Click the "Run" button to start verification.</div>`;
            }
        }
    }

    //Update the user's results for each round.
    function setUserRoundInfo(sort, roundList) {
        const roundsHtml = [];
        for (const round of roundList) {
            roundsHtml.push(`
                    <div class="round-item">
                        <div class="round-title">No.${round.roundNum} Round · SHA256</div>
                        <div class="round-hash">
                            <span>${round.hexStr}</span>
                            <span>${round.boxNum}</span>
                        </div>
                    </div>
                `);
        }
        const resultDiv = document.getElementById(`resultRound_${sort}`);
        if (resultDiv) {
            resultDiv.innerHTML = roundsHtml.join('');
        }
    }

    function restCode() {
        const params = getUrlParams();
        setCodeAndInfo(params);
        codeEditor.value = defaultCode;
        initEmptyResults();
        logs = "";
    }

    function showCodeEditor() {
        codePanel.open = !codePanel.open;
        setBtnText();
    }

    function setBtnText() {
        if (codePanel.open) {
            showCodeEditorBtn.innerText = `▲ Hide`;
        } else {
            showCodeEditorBtn.innerText = `▼ Show`;
        }
    }

    //Used to store captured logs.
    let capturedLogs = [];

    //Run Button Click Handler
    async function onRunClick(e) {
        const params = getUrlParams();
        let userWallet0 = document.getElementById("userWallet_0");
        let userWallet1 = document.getElementById("userWallet_1");
        let userWallet2 = document.getElementById("userWallet_2");
        //
        let code = "";
        if (blockHashAfterInp.value !== params.blockHash_1
        || blockHashInp.value !== params.blockHash
        || blockHashLast1Inp.value !== params.blockHash_2
        || blockHashLast2Inp.value !== params.blockHash_3
        || blockHashLast3Inp.value !== params.blockHash_4
        || parseInt(roundInput.value) !== params.round
        || (userWallet0 !== undefined && userWallet0 !== null && userWallet0.value !== params.userWallet[0])
        || (userWallet1 !== undefined && userWallet1 !== null && userWallet1.value !== params.userWallet[1])
        || (userWallet2 !== undefined && userWallet2 !== null && userWallet2.value !== params.userWallet[2])
        ) {
            let obj = {};
            obj.blockHash_1 = blockHashAfterInp.value;
            obj.blockHash = blockHashInp.value;
            obj.blockHash_2 = blockHashLast1Inp.value;
            obj.blockHash_3 = blockHashLast2Inp.value;
            obj.blockHash_4 = blockHashLast3Inp.value;
            obj.userWallet = [];
            for (let i = 0; i < userNum; i++) {
                obj.userWallet.push(document.getElementById("userWallet_" + i).value);
            }
            obj.round = parseInt(roundInput.value);
            setCodeAndInfo(obj);
            code = defaultCode;
            codeEditor.value = code;
        } else {
            code = codeEditor.value;
        }
        

        let result = await anonymous_fun.run(code);
        if (!isCodePass) {
            alert("A JavaScript execution error occurred. Please resolve the error or reset the code.");
        } else {
            if (e !== undefined && e.type === 'click') {
                for (let i = 0; i < userNum; i++) {
                    setUserRoundInfo(i, result[i]);
                }
            }
        }
    }

    //Clear Output Display (Does not clear the capture array; resets upon each run)
    function clearOutputDisplay() {
        outputContentDiv.innerHTML = '';
    }

    //Add an Output (Supports Multiple Types)
    function addOutput(message, type = 'log') {
        const line = document.createElement('div');
        line.style.marginBottom = '4px';
        line.style.borderBottom = '1px solid #2a2c3a';
        line.style.paddingBottom = '4px';

        let prefix = '';
        if (type === 'error') prefix = '❌ ';
        else if (type === 'warn') prefix = '⚠️ ';
        else if (type === 'info') prefix = 'ℹ️ ';

        const prefixSpan = document.createElement('span');
        if (type === 'error') prefixSpan.style.color = '#ff79c6';
        else if (type === 'warn') prefixSpan.style.color = '#f1fa8c';
        else prefixSpan.style.color = '#8be9fd';

        prefixSpan.textContent = prefix;

        const messageSpan = document.createElement('span');
        messageSpan.style.color = '#f8f8f2';
        // Convert objects, arrays, etc., into human-readable strings.
        let displayMsg;
        try {
            if (typeof message === 'object') {
                displayMsg = JSON.stringify(message, null, 2);
            } else {
                displayMsg = String(message);
            }
        } catch(e) {
            displayMsg = String(message);
        }

        logs += (displayMsg + "\n");
        messageSpan.textContent = displayMsg;

        line.appendChild(prefixSpan);
        line.appendChild(messageSpan);
        outputContentDiv.appendChild(line);
        outputContentDiv.parentElement.parentElement.scrollTop = outputContentDiv.parentElement.parentElement.scrollHeight;
    }

    // Clear Output (Clears display only; does not clear console history)
    function clearOutput() {
        outputContentDiv.innerHTML = '';
        addOutput('🧹 Output cleared. Click "Run Code" to execute again.', 'info');
        logs = "";
    }

    const anonymous_fun = (function() {
        // Save the original console methods.
        const originalConsole = {
            log: console.log,
            error: console.error,
            warn: console.warn,
            info: console.info
        };

        // The core function for running the code
        // The Core Function for Asynchronous Code Execution
        async function runCodeAsync(code) {
            // 1. Reset capture log array
            capturedLogs = [];

            // 2. Temporarily Replace Console Methods
            console.log = (...args) => {
                capturedLogs.push({ type: 'log', args });
                originalConsole.log(...args);
            };
            console.error = (...args) => {
                capturedLogs.push({ type: 'error', args });
                originalConsole.error(...args);
            };
            console.warn = (...args) => {
                capturedLogs.push({ type: 'warn', args });
                originalConsole.warn(...args);
            };
            console.info = (...args) => {
                capturedLogs.push({ type: 'info', args });
                originalConsole.info(...args);
            };

            // 3. Clear Output Display Area (UI)
            clearOutputDisplay();

            let executionError = null;
            let result = undefined;
            try {
                //Wrap and execute as an async function.
                const asyncFunction = new Function(`
                    return (async function() {
                        ${code}
                    })();
                `);
                result = await asyncFunction();
                //If there is a return value and it is not `undefined`, print it to the console as well.
                if (result !== undefined) {
                    capturedLogs.push({ type: 'log', args: ['Result =>', result] });
                }
                isCodePass = true;
            } catch (err) {
                isCodePass = false;
                executionError = err;
                capturedLogs.push({ type: 'error', args: [err.message || err] });
            } finally {
                // 6. Restore Original Console
                console.log = originalConsole.log;
                console.error = originalConsole.error;
                console.warn = originalConsole.warn;
                console.info = originalConsole.info;
            }

            // 7. Render all captured logs to the output area.
            for (const log of capturedLogs) {
                //Merge parameters into a single string (simple handling)
                const message = log.args.map(arg => {
                    if (typeof arg === 'object') {
                        try {
                            return JSON.stringify(arg);
                        } catch(e) {
                            return String(arg);
                        }
                    }
                    return String(arg);
                }).join(' ');
                addOutput(message, log.type);
            }

            // 8.If an error occurs during execution, provide an additional prompt.
            if (executionError) {
                addOutput(`Execution Exception: ${executionError.message}`, 'error');
            }
            return result;
        }

        // Return the functions that need to be exposed. Since the result of `new Function` is required to render the interface,
        // the function responsible for executing the code must be exposed to the top level for use.
        return {
            run: runCodeAsync
        };
    })();

    document.addEventListener('DOMContentLoaded', initPage);

    // Quickly detect and display browser information.
    function showCryptoStatus() {
        const status = {
            hasCrypto: !!window.crypto,
            hasSubtle: !!(window.crypto && window.crypto.subtle),
            hasDigest: !!(window.crypto && window.crypto.subtle && crypto.subtle.digest),
            isSecureContext: window.isSecureContext || false,
            userAgent: navigator.userAgent
        };

        console.log('Crypto status:', status);

        if (!status.hasCrypto) {
            console.log('❌ Not Support Crypto API');
        } else if (!status.hasSubtle) {
            console.log('⚠️ Supports basic crypto, but does not support Web Crypto API');
            console.log('   Please upgrade your browser.: Chrome 37+, Firefox 34+, Safari 11+');
        } else if (!status.isSecureContext) {
            console.log('⚠️ Web Crypto API need HTTPS or localhost');
            console.log('   Current Environment:', location.protocol);
        } else {
            console.log('✅ Support Web Crypto API');
        }

        return status;
    }
</script>
